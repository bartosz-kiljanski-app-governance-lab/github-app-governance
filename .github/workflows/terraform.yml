name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: terraform-state
      queue: max
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      GITHUB_TOKEN: ${{ secrets.GOVERNANCE_GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.STATE_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.sha }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check

      - name: Initialize
        env:
          BACKEND_CONFIG: ${{ vars.TERRAFORM_BACKEND_CONFIG }}
        run: |
          test -n "$GITHUB_TOKEN"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$BACKEND_CONFIG"
          printf '%s\n' "$BACKEND_CONFIG" > config/backend.tfbackend
          terraform init -input=false -lockfile=readonly -backend-config=config/backend.tfbackend

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=terraform.tfplan 2>&1 | tee plan.txt
          plan_exit=${PIPESTATUS[0]}
          set -e
          {
            printf '### Terraform plan\n\n```text\n'
            cat plan.txt
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$plan_exit" -ne 0 ] && [ "$plan_exit" -ne 2 ]; then
            exit "$plan_exit"
          fi

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -no-color terraform.tfplan
