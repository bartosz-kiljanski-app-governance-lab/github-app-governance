name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    concurrency:
      group: terraform-state
      queue: max
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_governance_repository: ${{ github.event.repository.name }}
    steps:
      - name: Reject fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        working-directory: .
        run: |
          echo "Fork PRs cannot run privileged Terraform plans."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check

      - name: Initialize
        env:
          GITHUB_TOKEN: ${{ secrets.GOVERNANCE_GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.STATE_SESSION_TOKEN }}
        run: |
          test -n "$GITHUB_TOKEN"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          terraform init -input=false -lockfile=readonly -backend-config=../config/backend.hcl

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GOVERNANCE_GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.STATE_SESSION_TOKEN }}
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=terraform.tfplan > plan.txt 2>&1
          plan_exit=$?
          set -e
          plan_text="$(cat plan.txt)"
          for secret in "$GITHUB_TOKEN" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN"; do
            if [ -n "$secret" ]; then
              plan_text="${plan_text//"$secret"/[REDACTED]}"
            fi
          done
          printf '%s\n' "$plan_text" > plan.txt
          {
            printf '### Terraform plan\n\n```text\n'
            cat plan.txt
            printf '\n```\n\n'
            printf '[Workflow run](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } | tee plan-comment.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$plan_exit" -ne 0 ] && [ "$plan_exit" -ne 2 ]; then
            exit "$plan_exit"
          fi

      - name: Comment plan
        if: always() && github.event_name == 'pull_request' && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          header: terraform-plan
          path: terraform/plan-comment.md

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GOVERNANCE_GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.STATE_SESSION_TOKEN }}
        run: terraform apply -input=false -no-color terraform.tfplan
